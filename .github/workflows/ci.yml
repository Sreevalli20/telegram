name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      continue-on-error: true
    
    - name: Check code formatting
      run: |
        pip install black
        black --check app/
      continue-on-error: true
    
    - name: Validate application startup
      run: |
        python -c "from app.main import app; print('Application imports successfully')"
      env:
        TELEGRAM_BOT_TOKEN: test_token
        DATABASE_URL: sqlite:///./test.db
        AI_PROVIDER: openai
        OPENAI_API_KEY: test_key
    
    - name: Security scan
      run: |
        pip install bandit
        bandit -r app/ -f json -o bandit-report.json || true
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t atlas-ai-assistant:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm atlas-ai-assistant:latest python -c "from app.main import app; print('Docker image works')"
      env:
        TELEGRAM_BOT_TOKEN: test_token
        DATABASE_URL: sqlite:///./test.db
        AI_PROVIDER: openai
        OPENAI_API_KEY: test_key
